{% load allauth %}
{% load crispy_forms_tags %}

{% if attrs.type == "textarea" %}
  <div class="mb-3">
    <label for="{{ attrs.id }}" class="form-label" style="font-weight: 500; color: #1e293b;">
      {% slot label %}{% endslot %}
    </label>
    <textarea {% if attrs.required %}required{% endif %}
              {% if attrs.rows %}rows="{{ attrs.rows }}"{% endif %}
              {% if attrs.disabled %}disabled{% endif %}
              {% if attrs.readonly %}readonly{% endif %}
              {% if attrs.checked %}checked{% endif %}
              {% if attrs.name %}name="{{ attrs.name }}"{% endif %}
              {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
              {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"{% endif %}
              class="form-control"
              style="border-radius: 0.5rem; border-color: #e2e8f0; padding: 0.625rem 0.875rem;">{% slot value %}{% endslot %}</textarea>
  </div>
{% elif attrs.type == "radio" %}
  <div class="mb-2">
    <div class="form-check">
      <input {% if attrs.required %}required{% endif %}
             {% if attrs.disabled %}disabled{% endif %}
             {% if attrs.readonly %}readonly{% endif %}
             {% if attrs.checked %}checked{% endif %}
             {% if attrs.name %}name="{{ attrs.name }}"{% endif %}
             {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
             {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"{% endif %}
             {% if attrs.autocomplete %}autocomplete="{{ attrs.autocomplete }}"{% endif %}
             value="{{ attrs.value|default_if_none:"" }}"
             type="{{ attrs.type }}"
             class="form-check-input"
             style="border-color: #e2e8f0;" />
      <label class="form-check-label" for="{{ attrs.id }}" style="color: #1e293b;">
        {% slot label %}{% endslot %}
      </label>
    </div>
  </div>
{% else %}
  <div class="mb-3">
    <label for="{{ attrs.id }}" class="form-label" style="font-weight: 500; color: #1e293b;">
      {% slot label %}{% endslot %}
    </label>
    <input {% if attrs.required %}required{% endif %}
           {% if attrs.disabled %}disabled{% endif %}
           {% if attrs.readonly %}readonly{% endif %}
           {% if attrs.checked %}checked{% endif %}
           {% if attrs.name %}name="{{ attrs.name }}"{% endif %}
           {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
           {% if attrs.placeholder %}placeholder="{{ attrs.placeholder }}"{% endif %}
           {% if attrs.autocomplete %}autocomplete="{{ attrs.autocomplete }}"{% endif %}
           value="{{ attrs.value|default_if_none:"" }}"
           type="{{ attrs.type }}"
           class="form-control"
           style="border-radius: 0.5rem; border-color: #e2e8f0; padding: 0.625rem 0.875rem;" />
  </div>
{% endif %}
{% if slots.help_text %}
  <div class="form-text" style="color: #64748b; font-size: 0.875rem;">{% slot help_text %}{% endslot %}</div>
{% endif %}
